services:

  api:
    build: .
    container_name: task-forge-api
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    ports:
      - "8000:8000"
    volumes:
      - ./worker_logs:/app/worker_logs
      - ./app:/app/app
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: task-forge-redis
    ports:
      - "6379:6379"
    restart: unless-stopped